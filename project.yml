name: Sirocco
options:
  bundleIdPrefix: it.simoneriva
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ARCHS: arm64
    VALID_ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/CShims
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.6.0
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Sirocco:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.simoneriva.sirocco
        PRODUCT_NAME: Sirocco
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simone Riva. All rights reserved."
        INFOPLIST_KEY_CFBundleDisplayName: Sirocco
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: Sirocco.entitlements
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
  SiroccoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Sirocco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.simoneriva.sirocco.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sirocco:
    build:
      targets:
        Sirocco: all
        SiroccoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SiroccoTests]
