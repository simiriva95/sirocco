name: Sirocco
options:
  bundleIdPrefix: it.simoneriva
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ARCHS: arm64
    VALID_ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/CShims
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.7.0
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Sirocco:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Sirocco
        NSHumanReadableCopyright: "© 2026 Simone Riva. All rights reserved."
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        # Sparkle: appcast lives in the public downloads repository; public EdDSA key below.
        SUFeedURL: https://raw.githubusercontent.com/simiriva95/sirocco-releases/main/appcast.xml
        SUPublicEDKey: v0RUObOMIriKvVagZvU18EgWaQhvG7tHRuaMRoo0790=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.simoneriva.sirocco
        PRODUCT_NAME: Sirocco
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sirocco.entitlements
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
  SiroccoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Sirocco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.simoneriva.sirocco.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sirocco:
    build:
      targets:
        Sirocco: all
        SiroccoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SiroccoTests]
